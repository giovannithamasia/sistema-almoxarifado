<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel - FerraSul Sistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body style="background-color: #0b0d11; color: #ffffff; font-family: 'Inter', sans-serif;">
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark py-3" style="background-color: #111622 !important; border-bottom: 1px solid #1e293b !important; font-family: 'Inter', sans-serif !important;">
  <div class="container-fluid px-4 px-lg-5">
    <a class="navbar-brand d-flex align-items-center gap-2 m-0" th:href="@{/home}" style="text-decoration: none !important;">
      <div style="background-color: #f59e0b !important; width: 40px !important; height: 40px !important; border-radius: 8px !important; display: flex !important; align-items: center !important; justify-content: center !important; flex-shrink: 0 !important;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b0d11" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
      </div>
      <span style="color: #ffffff !important; font-weight: 700 !important; font-size: 1.35rem !important; font-family: 'Outfit', sans-serif !important;">FerraSul</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-4">
        <li class="nav-item">
          <a class="nav-link fw-medium" th:href="@{/home}" style="color: #ffffff !important; font-size: 1.15rem !important; font-family: 'Inter', sans-serif !important;">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" th:href="@{/produtolista}" style="color: #ffffff !important; font-size: 1.15rem !important; font-family: 'Inter', sans-serif !important;">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" th:href="@{/movimentacoes}" style="color: #ffffff !important; font-size: 1.15rem !important; font-family: 'Inter', sans-serif !important;">Estoque</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: #e2e8f0 !important; padding: 0 !important;">
            <span class="usuario-avatar" th:with="u=${usuarioLogado != null ? usuarioLogado : (session != null and session.usuarioLogado != null ? session.usuarioLogado : null)}, rawNome=${u != null ? (u.usuarioNome != null ? u.usuarioNome : (u.nome != null ? u.nome : '')) : (#authentication != null and #authentication.name != 'anonymousUser' ? #authentication.name : '')}" th:text="${!#strings.isEmpty(rawNome) ? #strings.substring(rawNome, 0, 1).toUpperCase() : 'C'}" style="width: 38px !important; height: 38px !important; display: flex !important; align-items: center !important; justify-content: center !important; background-color: #252b3a !important; color: #ffffff !important; border-radius: 50% !important; font-weight: 700 !important; font-size: 1.1rem !important; border: 1px solid #334155 !important; font-family: 'Inter', sans-serif !important;">C</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark" style="background-color: #0b0d11 !important; border: 1px solid #343a40 !important;">
            <li>
              <a class="dropdown-item text-danger" th:href="@{/logout}" style="font-family: 'Inter', sans-serif !important;">Sair</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main class="container my-5">
  <div class="mb-4">
    <p style="color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace;">PAINEL PRINCIPAL</p>
    <h1 style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 2.2rem;">O que você precisa fazer?</h1>
  </div>
  <div class="row g-4">
    <div class="col-md-6">
      <a th:href="@{/produtocadastrar}" class="text-decoration-none">
        <div style="background-color: #111622; border: 1px solid #1e293b; border-radius: 12px; padding: 28px; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
          <div style="background-color: rgba(245, 158, 11, 0.1); width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #f59e0b; margin-bottom: 16px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 16V8C20.9996 7.64928 20.9071 7.30481 20.7315 7.00116C20.556 6.69751 20.3037 6.44536 20 6.27L13 2.27C12.696 2.09446 12.3511 2.00205 12 2.00205C11.6489 2.00205 11.304 2.09446 11 2.27L4 6.27C3.69626 6.44536 3.44398 6.69751 3.26846 7.00116C3.09294 7.30481 3.00036 7.64928 3 8V16C3.00036 16.3507 3.09294 16.6952 3.26846 16.9988C3.44398 17.3025 3.69626 17.5546 4 17.73L11 21.73C11.304 21.9055 11.6489 21.9979 12 21.9979C12.3511 21.9979 12.696 21.9055 13 21.73L20 17.73C20.3037 17.5546 20.556 17.3025 20.7315 16.9988C20.9071 16.6952 20.9996 16.3507 21 16Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 12V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 12L3.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 12L20.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3 style="color: #ffffff; font-size: 1.25rem; font-weight: 600; margin-bottom: 6px;">Cadastro de produto</h3>
          <p style="color: #94a3b8; font-size: 0.95rem; margin: 0;">Adicionar novo item ao catálogo</p>
        </div>
      </a>
    </div>
    <div class="col-md-6">
      <a th:href="@{/movimentacoes}" class="text-decoration-none">
        <div style="background-color: #111622; border: 1px solid #1e293b; border-radius: 12px; padding: 28px; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
          <div style="background-color: rgba(245, 158, 11, 0.1); width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #f59e0b; margin-bottom: 16px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 4H2V20H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 4H16V20H22V4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 8H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 16H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3 style="color: #ffffff; font-size: 1.25rem; font-weight: 600; margin-bottom: 6px;">Gestão de estoque</h3>
          <p style="color: #94a3b8; font-size: 0.95rem; margin: 0;">Ver e movimentar itens</p>
        </div>
      </a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
