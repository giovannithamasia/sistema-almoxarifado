<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body class="bg-light">

<!-- Navbar puxada do fragmento que você já tem -->
<div th:replace="~{/navbar :: navbar}"></div>

<main class="container py-4">

    <!-- Alertas de Sucesso/Erro -->
    <div class="alert alert-success" role="alert" th:if="${mensagemCriacao}" th:text="${mensagemCriacao}"></div>
    <div class="alert alert-success" role="alert" th:if="${mensagemAtualizacao}" th:text="${mensagemAtualizacao}"></div>
    <div class="alert alert-danger" th:if="${erroNotFound}" th:text="${erroNotFound}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 fw-bold">Produtos em Estoque</h6>

            <!-- RF-004: Formulário de Pesquisa -->
            <form th:action="@{/produtolista}" method="get" class="d-flex">
                <input class="form-control me-2" type="search" name="termo" placeholder="Buscar produto..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>
        </div>

        <div class="card-body">
            <p class="card-text">
                <!-- Botão de Cadastro (RF-003) -->
                <a class="btn btn-primary" th:href="@{/produtocadastrar}">+ Novo Produto</a>
            </p>

            <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Código</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Características</th>
                        <th scope="col">Estoque Atual</th>
                        <th scope="col">Estoque Mínimo</th>
                        <th scope="col">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Iterando sobre a listaProdutos injetada pelo seu Controller -->
                    <tr th:each="produto : ${listaProdutos}">
                        <td th:text="${produto.id}">1</td>
                        <td th:text="${produto.codigo}">FRM-001</td>
                        <td th:text="${produto.nome}">Martelo</td>
                        <td th:text="${produto.caracteristicas}">Cabo de madeira</td>
                        <td th:text="${produto.estoqueAtual}">50</td>
                        <td th:text="${produto.estoqueMinimo}">10</td>
                        <td>
                            <!-- Botões de Editar e Excluir (RF-005 e RF-006) -->
                            <a class="btn btn-sm btn-warning" th:href="@{/produtoatualizar/{id}(id=${produto.id()})}">Editar</a>
                            <button th:data-id="${produto.id()}" class="excluir btn btn-sm btn-danger">Excluir</button>
                        </td>
                    </tr>

                    <!-- Mensagem caso a lista esteja vazia ou a pesquisa não retorne nada (FE-01 do RF-004) -->
                    <tr th:if="${#lists.isEmpty(listaProdutos)}">
                        <td colspan="7" class="text-center text-secondary py-4">Nenhum produto encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="/js/excluir_produto.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
