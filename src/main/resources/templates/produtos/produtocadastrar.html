<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body class="bg-light">

<div th:replace="~{/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <!-- FE-03: Alerta para produto já cadastrado com o mesmo código -->
            <div class="alert alert-danger" role="alert" th:if="${erroCodigoDuplicado}" th:text="${erroCodigoDuplicado}"></div>

            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h6 class="m-0 fw-bold">Cadastrar Novo Produto</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/produtocadastrar}" th:object="${produtoDto}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="codigo" class="form-label">Código do Produto</label>
                            <input type="text" class="form-control" id="codigo" th:field="*{codigo}" placeholder="Ex: FRM-001" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Informe o nome do produto" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="caracteristicas" class="form-label">Características</label>
                            <input type="text" class="form-control" id="caracteristicas" th:field="*{caracteristicas}" placeholder="Material, tamanho, peso..." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('caracteristicas')}" th:errors="*{caracteristicas}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="estoqueAtual" class="form-label">Estoque Atual</label>
                                <input type="number" class="form-control" id="estoqueAtual" th:field="*{estoqueAtual}" placeholder="Quantidade inicial" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('estoqueAtual')}" th:errors="*{estoqueAtual}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="estoqueMinimo" class="form-label">Estoque Mínimo</label>
                                <input type="number" class="form-control" id="estoqueMinimo" th:field="*{estoqueMinimo}" placeholder="Quantidade mínima" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('estoqueMinimo')}" th:errors="*{estoqueMinimo}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a class="btn btn-outline-secondary" th:href="@{/produtolista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Produto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
